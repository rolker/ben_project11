/**/platform_sender:
  ros__parameters:
    width: 1.7
    length: 4.25
    reference_x: 0.525
    color:
      red: 1.0
      green: 0.8
      blue: 0.1

    nav:
      source_names:
        - posmv
        - oem
      sources:
        posmv:
          topics:
            orientation: "sensors/posmv/orientation"
            position: "sensors/posmv/position"
            velocity: "sensors/posmv/velocity"
        oem:
          topics:
            orientation: "sensors/oem/orientation"
            position: "sensors/oem/position"
            velocity: "sensors/oem/velocity"


/**/mru_transform:
  ros__parameters:
    sensors:
      posmv:
        topics:
          orientation: "sensors/posmv/orientation"
          position: "sensors/posmv/position"
          velocity: "sensors/posmv/velocity"
      oem:
        topics:
          orientation: "sensors/oem/orientation"
          position: "sensors/oem/position"
          velocity: "sensors/oem/velocity"
    sensor_names:
    - posmv
    - oem


/**/navigator:
  ros__parameters:
    robot:
      turn_radius: 7.5
      # - velocity: 0.5
      #   radius: 5.0
      # - velocity: 2.75
      #   radius: 12.0
      
      max_velocity:
        linear:
          x: 2.75
        angular:
          z: .45

      min_velocity:
        angular:
          z: -.45


      default_velocity:
        linear.x: 2.5

      max_acceleration:
        linear.x: 0.8
        angular.z: 0.2

      default_acceleration:
        linear:
          x: 0.7
        angular:
          z: .2

      default_deceleration:
        linear.x: -0.45
        angular.z: -0.2

      max_deceleration:
        linear.x: -0.7
        angular.z: -0.2


      min_velocity:
        linear.x: 0.5

      footprint: "[[2.65, 0.0], [2.6, 0.1], [2.4, 0.4], [1.9, 0.6], [1.0, 0.85], [-1.3, 0.85], [-1.35, 0.4], [-1.6, 0.35], [-1.6, -0.35], [-1.35, -0.4], [-1.3, -0.85], [1.0, -0.85], [1.9, -0.6], [2.4, -0.4], [2.6, -0.1], [2.65, 0.0]]"

      radius: 5.0

    waypoint_reached_distance: 5.0
    survey_lead_in_distance: 3.5


/**/helm_manager:
  ros__parameters:
    output_type: 'helm'
    max_yaw_speed: 0.5   
    max_speed: 2.75

/**/asv_helm:
  ros__parameters:
    pid:
      Kp: 0.36
      Ki: 1.0
      Kd: 0.01
      upper_limit: 1.0
      lower_limit: -1.0
      windup_limit: 1.0
      max_dt: 1.0

/**/s57_grids:
  ros__parameters:
    map_frame: ben/map

    robot:
      frame_id: ben/base_link
      minimum_depth: 0.0
      maximum_caution_depth: 3.0
      overhead_clearance: 4.0
      minimum_speed: 0.01
      maximum_speed: 2.75

    grids:
      global:
        resolution: 25.0
        length: 175000.0
        period: 30.0
      area:
        resolution: 6.0
        length: 15000.0
        period: 30.0
      local:
        resolution: 3.0
        length: 5000.0
        period: 1.0


/**/udp_bridge:
  ros__parameters:
    name: ben
    remotes:
      operator:
        connections:
          default:
            topics:
              asv_helm_pid: {source: asv_helm/pid/debug}
              autonomous_cmd_vel: {source: project11/piloting_mode/autonomous/cmd_vel}
              control_cmd_vel: {source: project11/control/cmd_vel}
              nav_visualization_markers: {source: navigator/visualization_markers}
              odom: {source: odom}
              s57_local_grid: {source: s57_grids/grids/local}

   
